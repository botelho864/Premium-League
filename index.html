function normalize(d) {
  d.seasons = (d.seasons || []).map(s => {
    s = withDefaults(s);
    s.players = s.players || [];
    s.fines = s.fines || [];
    s.weeks = (s.weeks || []).map(w => ({ date: w.date || "", gB: (w.gB === undefined || w.gB === null) ? "" : w.gB, gP: (w.gP === undefined || w.gP === null) ? "" : w.gP, marks: w.marks || {}, locked: !!w.locked }));
    return s;
  });
  return d;
}

function fmtDate(iso) {

function migrate(raw) {

function computeStats(season) {
  const rows = season.players.filter(p => !p.guest).map((p, idx) => {
    let V = 0, E = 0, D = 0, D1 = 0, D2 = 0, F = 0, J = 0, golos = 0;
    const form = [];
    season.weeks.forEach(w => {
      const mk = w.marks[p.name];
      if (!mk) return;
      if (mk === "D1") D1++;
      if (mk === "D2") D2++;
      if (mk === "F") F++;
      if (mk === "B" || mk === "P") {
        J++;
        const hasScore = w.gB !== null && w.gB !== "" && w.gP !== null && w.gP !== "";
        if (hasScore) {
          const mine = mk === "B" ? Number(w.gB) : Number(w.gP);
          const theirs = mk === "B" ? Number(w.gP) : Number(w.gB);
          golos += mine;
          if (mine > theirs) { V++; form.push("V"); }
          else if (mine === theirs) { E++; form.push("E"); }
          else { D++; form.push("D"); }
        }
      }
    });
    const pts = V * season.points.V + E * season.points.E + D * season.points.D + D1 * season.points.D1 + D2 * season.points.D2;
    const lost = D1 * Math.abs(season.points.D1) + D2 * Math.abs(season.points.D2);
    let streak = 0;
    for (let i = form.length - 1; i >= 0 && form[i] === "V"; i--) streak++;
    return { name: p.name, pts, J, V, E, D, D1, D2, F, golos, lost, form: form.slice(-5), streak, idx };
  });
  rows.sort((a, b) => b.pts - a.pts || b.J - a.J || b.V - a.V || a.lost - b.lost || a.idx - b.idx);
  rows.forEach((r, i) => { r.pos = i + 1; });
  return rows;
}

function weekSummary(w) {
  const nB = Object.values(w.marks).filter(m => m === "B").length;
  const nP = Object.values(w.marks).filter(m => m === "P").length;
  const hasScore = w.gB !== null && w.gB !== "" && w.gP !== null && w.gP !== "";
  let winner = null;
  if (hasScore) winner = Number(w.gB) > Number(w.gP) ? "Branca" : Number(w.gP) > Number(w.gB) ? "Preta" : "Empate";
  return { nB, nP, hasScore, winner };
}

function parseHM(t) { const [h, m] = (t || "0:0").split(":").map(Number); return [h || 0, m || 0]; }
function nextOccurrence(dow, timeStr) {
  const [h, m] = parseHM(timeStr);
  const now = new Date();
  const t = new Date(now);
  t.setHours(h, m, 0, 0);
  let delta = (dow - now.getDay() + 7) % 7;
  if (delta === 0 && t <= now) delta = 7;
  t.setDate(t.getDate() + delta);
  return t;
}
function fmtDelta(target, now) {
  const s = Math.max(0, Math.floor((target - now) / 1000));
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), mi = Math.floor((s % 3600) / 60);
  return d > 0 ? `${d}d ${h}h ${mi}m` : `${h}h ${mi}m`;
}

function Countdown({ season }) {
  const [now, setNow] = useState(new Date());
  useEffect(() => { const id = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(id); }, []);
  const conv = nextOccurrence(season.convDay, season.convTime);
  const jogo = nextOccurrence(season.gameDay, season.gameTime);
  const convOpen = jogo < conv;
  const chip = (icon, top, bottom, hot) => (
    <div style={{
      flex: 1, background: hot ? C.ink : C.surface, color: hot ? "#fff" : C.ink,
      border: `1px solid ${hot ? C.ink : C.line}`, borderRadius: 10, padding: "8px 10px",
      display: "flex", alignItems: "center", gap: 8, minWidth: 0,
    }}>
      <span style={{ fontSize: 20 }}>{icon}</span>
      <div style={{ minWidth: 0 }}>
        <div style={{ fontFamily: FONT_NUM, fontSize: 17, fontWeight: 700, lineHeight: 1.1 }}>{top}</div>
        <div style={{ fontSize: 11, opacity: 0.75, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{bottom}</div>
      </div>
    </div>
  );
  return (
    <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
      {chip("📣", convOpen ? "Convocatória aberta" : `abre em ${fmtDelta(conv, now)}`,
        convOpen ? `primeiros ${season.convSlots} a mandar "." contam` : `${DAYS[season.convDay]} às ${season.convTime}`, convOpen)}
      {chip("⚽", `jogo em ${fmtDelta(jogo, now)}`, `${DAYS[season.gameDay]} às ${season.gameTime}`, false)}
    </div>
  );
}

function FormDots({ form }) {
  if (!form.length) return null;
  const col = { V: C.green, E: "#9AA096", D: C.red };
  return (
    <span style={{ display: "inline-flex", gap: 3, marginLeft: 6, verticalAlign: "middle" }}>
      {form.map((f, i) => (
        <span key={i} title={f} style={{ width: 7, height: 7, borderRadius: 7, background: col[f], display: "inline-block" }} />
      ))}
    </span>
  );
}

        if (firstLoad.current) { setSIdx(v3.seasons.length - 1); firstLoad.current = false; }
        else { setSIdx(i => Math.min(i, v3.seasons.length - 1)); setSaveState("saved"); }
      }, (err) => { setStorageOk(false); setData(prev => prev || JSON.parse(JSON.stringify(SEED))); });
    } catch (e) { setStorageOk(false); setData(JSON.parse(JSON.stringify(SEED))); }
    return () => { if (dbRef.current) dbRef.current.child("data").off(); };
  }, [demo]);

  const update = (next) => {
    setData(next);
    lastJson.current = JSON.stringify(next);
    if (!dbRef.current || !storageOk) { setSaveState("local"); return; }
    setSaveState("saving");
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      dbRef.current.set({ _pin: pinRef.current || "", data: JSON.parse(lastJson.current) })
        .then(() => setSaveState("saved"))
        .catch((err) => {
          const denied = err && String(err.code || err.message || "").toUpperCase().includes("PERMISSION");
          setSaveState(denied ? "denied" : "local");
          dbRef.current.child("data").once("value").then(s => {
            const v = s.val();
            if (v) { lastJson.current = JSON.stringify(v); setData(normalize(migrate(v))); }
          }).catch(() => {});
        });
    }, 500);
  };

  useEffect(() => {
    if (!configured || demo || !data || !pinRef.current || backupDone.current) return;
    if (saveState !== "saved") return;
    backupDone.current = true;
    try {
      const bref = firebase.database().ref("backups");
      bref.child("data").once("value").then(s => {
        const cur = s.val() || {};
        const keys = Object.keys(cur).sort();
        const today = new Date().toISOString().slice(0, 10);
        const last = keys[keys.length - 1] || "";
        if (last && (new Date(today) - new Date(last)) < 7 * 86400000) { setLastBackup(last); return; }
        cur[today] = JSON.parse(JSON.stringify(data));
        const trimmed = {};
        Object.keys(cur).sort().slice(-10).forEach(k => { trimmed[k] = cur[k]; });
        bref.set({ _pin: pinRef.current, data: trimmed })
          .then(() => setLastBackup(today))
          .catch(() => {});
      }).catch(() => {});
    } catch (e) {}
  }, [saveState, data]);

            <p style={{ fontSize: 12, color: C.sub, marginTop: 10 }}>

        {tab === "weeks" && openWeek === null && (

          const bPlayers = Object.keys(w.marks).filter(k => w.marks[k] === "B");

                      setMark(name, isNewGuest ? "P" : "B");
                      setNewPlayerName("");
                    }} style={{ background: C.green, color: "#fff", border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>Adicionar</button>
                  </div>
                )}

                <div style={{ maxHeight: 280, overflowY: "auto", border: `1px solid ${C.line}`, borderRadius: 6 }}>
                  {sortedPlayers.map((p, i) => {
                    const mk = w.marks[p.name];
                    return (
                      <div key={p.name} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "6px 8px", borderTop: i ? `1px solid ${C.line}` : "none", background: p.guest ? "#FAFAF7" : "#fff" }}>
                        <span style={{ fontSize: 13, fontStyle: p.guest ? "italic" : "normal", color: p.guest ? C.sub : C.ink, flex: 1 }}>
                          {p.name} {p.guest ? "(Estrangeiro)" : ""}
                        </span>
                        <div style={{ display: "flex", gap: 2 }}>
                          {CODES.map(code => {
                            const on = mk === code;
                            return (
                              <button key={code} disabled={!canModifyWeek} onClick={() => setMark(p.name, code)} style={{
                                minWidth: 26, padding: "3px 4px", borderRadius: 4, cursor: canModifyWeek ? "pointer" : "default",
                                fontSize: 11, fontWeight: 700, fontFamily: FONT_NUM,
                                border: `1px solid ${on ? C.ink : C.line}`,
                                background: on ? C.ink : "transparent",
                                color: on ? "#fff" : C.sub,
                              }}>{code}</button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div style={{ fontSize: 11, color: C.sub, marginTop: 6 }}>
                  Legenda: B (Branca) | P (Preta) | Justificada (0 pts) | D1 (-1 pt) | D2 (-2 pts) | DOE (Doença) | F (Falta) | ? (Reserva)
                </div>
              </div>

              {/* FASE 2: SELEÇÃO DE EQUIPAS (Gerador automático equilibrado + Reservas + Copiar para WhatsApp) */}
              <div style={{ ...S.card, padding: 14 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={{ fontFamily: FONT_NUM, fontSize: 18, fontWeight: 700 }}>2. Seleção de Equipas & Alocação</div>
                  {canModifyWeek && is2026_3OrLater && (
                    <button onClick={() => {
                      // Recolher todos os marcados como B, P ou ?
                      const active = Object.keys(w.marks).filter(k => ["B", "P", "?"].includes(w.marks[k]));
                      if (active.length < 4) { alert("Seleciona pelo menos 4 jogadores convocados."); return; }
                      
                      const is11 = active.length >= 20 && confirm("Tens 20+ jogadores. Pretendes formato 11v11? (OK para 11v11, Cancelar para 8v8)");
                      const teamSize = is11 ? 11 : 8;

                      // Ordenar por pontos históricos da época para equilibrar em serpente
                      const scored = active.map(name => {
                        const st = stats.find(r => r.name === name);
                        return { name, pts: st ? st.pts : 0, isGuest: season.players.find(p => p.name === name)?.guest };
                      });
                      scored.sort((a, b) => b.pts - a.pts);

                      const marks = { ...w.marks };
                      let bCount = 0, pCount = 0;

                      scored.forEach((p, idx) => {
                        if (idx >= teamSize * 2) {
                          marks[p.name] = "?"; // Reservas
                        } else {
                          // Serpente para equilibrar
                          const round = Math.floor(idx / 2);
                          let assignB = (round % 2 === 0) ? (idx % 2 === 0) : (idx % 2 !== 0);
                          if (assignB && bCount < teamSize) {
                            marks[p.name] = "B"; bCount++;
                          } else if (pCount < teamSize) {
                            marks[p.name] = "P"; pCount++;
                          } else {
                            marks[p.name] = "B"; bCount++;
                          }
                        }
                      });
                      setWeek({ marks });
                    }} style={{ background: C.green, color: "#fff`, border: "none", borderRadius: 6, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                      ⚖️ Gerar Equipas
                    </button>
                  )}
                </div>

                <div style={{ display: "flex", gap: 10, marginBottom: 10 }}>
                  <div style={{ flex: 1, background: "#F9F9F9", border: `1px solid ${C.line}`, borderRadius: 8, padding: 8 }}>
                    <b>⚪ Equipa Branca ({bPlayers.length})</b>
                    <ul style={{ margin: "4px 0 0", paddingLeft: 16, fontSize: 13 }}>
                      {bPlayers.map(n => {
                        const g = season.players.find(p => p.name === n)?.guest;
                        return <li key={n}>{n} {g ? "(Estrangeiro)" : ""}</li>;
                      })}
                    </ul>
                  </div>
                  <div style={{ flex: 1, background: "#F9F9F9", border: `1px solid ${C.line}`, borderRadius: 8, padding: 8 }}>
                    <b>⚫ Equipa Preta ({pPlayers.length})</b>
                    <ul style={{ margin: "4px 0 0", paddingLeft: 16, fontSize: 13 }}>
                      {pPlayers.map(n => {
                        const g = season.players.find(p => p.name === n)?.guest;
                        return <li key={n}>{n} {g ? "(Estrangeiro)" : ""}</li>;
                      })}
                    </ul>
                  </div>
                </div>

                {reserves.length > 0 && (
                  <div style={{ background: "#FBF3DC", border: `1px solid ${C.gold}`, borderRadius: 8, padding: 8, marginBottom: 10, fontSize: 13 }}>
                    <b>⚠️ Reservas ({reserves.length}):</b> {reserves.join(", ")}
                  </div>
                )}

                <button onClick={() => {
                  const text = `⚽ *Jornada ${openWeek + 1} — Premium League* ⚽\n\n` +
                    `⚪ *Equipa Branca:* \n${bPlayers.map(n => "- " + n + (season.players.find(p => p.name === n)?.guest ? " (Estrangeiro)" : "")).join("\n")}\n\n` +
                    `⚫ *Equipa Preta:* \n${pPlayers.map(n => "- " + n + (season.players.find(p => p.name === n)?.guest ? " (Estrangeiro)" : "")).join("\n")}` +
                    (reserves.length > 0 ? `\n\n📌 *Reservas:* ${reserves.join(", ")}` : "");
                  navigator.clipboard.writeText(text);
                  alert("Alinhamento copiado para o clipboard! Podes colar no WhatsApp.");
                }} style={{ width: "100%", background: C.ink, color: "#fff", border: "none", borderRadius: 6, padding: "8px", fontSize: 13, fontWeight: 600, cursor: "pointer" }}>
                  📋 Copiar Equipas para o WhatsApp
                </button>
              </div>
            </div>
          );
        })()}

        {tab === "rules" && (
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <div style={{ ...S.card, padding: 14, background: C.ink, color: "#fff", border: "none" }}>
              <div style={{ fontFamily: FONT_NUM, fontSize: 20, fontWeight: 700, marginBottom: 10 }}>🏆 Prémios</div>
              {(season.prizes || []).map(p => {
                const holder = stats[p.pos - 1];
                return (
                  <div key={p.pos} style={{ display: "flex", alignItems: "center", gap: 10, padding: "6px 0", borderTop: "1px solid #333" }}>
                    <span style={{ fontFamily: FONT_NUM, fontSize: 20, fontWeight: 700, width: 26, color: p.pos <= 3 ? "#F0C64B" : "#bbb" }}>{p.pos}º</span>
                    <span style={{ fontSize: 18 }}>{p.icon}</span>
                    <span style={{ flex: 1, fontSize: 14, fontWeight: 600 }}>{holder ? holder.name : "—"}</span>
                    <span style={{ fontFamily: FONT_NUM, fontSize: 17, fontWeight: 700, color: "#F0C64B" }}>{p.label}</span>
                  </div>
                );
              })}
            </div>

            <div style={{ ...S.card, padding: 14 }}>
              <div style={{ fontFamily: FONT_NUM, fontSize: 20, fontWeight: 700, marginBottom: 6 }}>📣 Convocatória & Formação de Equipas</div>
              <p style={{ fontSize: 13.5, color: C.sub, margin: 0, lineHeight: 1.6 }}>
                As convocatórias abrem à 6ª feira às 13:00. Os primeiros a responder contam. As equipas são geradas automaticamente de forma equilibrada tendo em conta o histórico de pontos e assiduidade, suportando formatos 8v8 ou 11v11 com gestão automática de reservas.
              </p>
            </div>

            <div style={{ ...S.card, padding: 14 }}>
              <div style={{ fontFamily: FONT_NUM, fontSize: 20, fontWeight: 700, marginBottom: 8 }}>Pontuação</div>
              {[["V", "Vitória"], ["E", "Empate"], ["D", "Derrota"], ["D1", "Desistência após sábado"], ["D2", "Desistência após 2ª feira 00h"]].map(([k, lab]) => (
                <div key={k} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderTop: `1px solid ${C.line}` }}>
                  <span style={{ fontSize: 14 }}>{lab} ({k})</span>
                  <input type="number" disabled={!canEditGeneral} value={season.points[k]}
                    onChange={e => setSeason({ points: { ...season.points, [k]: Number(e.target.value) } })}
                    style={{ ...S.input, width: 60, textAlign: "center", fontFamily: FONT_NUM, fontSize: 16, fontWeight: 700 }} />
                </div>
              ))}
              <div style={{ display: "flex", justifyContent: "space-between", padding: "5px 0", borderTop: `1px solid ${C.line}`, fontSize: 14, color: C.sub }}>
                <span>Falta (F) / Justificada / Doença</span><span style={{ fontFamily: FONT_NUM, fontWeight: 700 }}>0</span>
              </div>
            </div>

            <div style={{ ...S.card, padding: 14 }}>
              <div style={{ fontFamily: FONT_NUM, fontSize: 20, fontWeight: 700, marginBottom: 8 }}>Jogadores — {season.name}</div>
              {canEditGeneral && (
                <AddPlayer onAdd={(name, guest) => {
                  const nm = name.trim();
                  if (!nm || season.players.some(p => p.name === nm)) return;
                  if (/[.#$\[\]\/]/.test(nm)) { alert("O nome não pode conter . # $ [ ] /"); return; }
                  setSeason({ players: [...season.players, { name: nm, guest }] });
                }} />
              )}
              {[...leaguePlayers, ...guests].sort((a,b)=>a.name.localeCompare(b.name)).map(p => (
                <div key={p.name} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "5px 0", borderTop: `1px solid ${C.line}` }}>
                  <span style={{ fontSize: 14, fontStyle: p.guest ? "italic" : "normal", color: p.guest ? C.sub : C.ink }}>{p.name} {p.guest ? "(Estrangeiro)" : ""}</span>
                  {canEditGeneral && (
                    <div style={{ display: "flex", gap: 6 }}>
                      <button onClick={() => setSeason({ players: season.players.map(x => x.name === p.name ? { ...x, guest: !x.guest } : x) })}
                        style={{ fontSize: 12, border: `1px solid ${C.line}`, background: "transparent", borderRadius: 6, padding: "3px 8px", cursor: "pointer", color: C.sub }}>
                        {p.guest ? "tornar da liga" : "tornar convidado"}
                      </button>
                      <button onClick={() => {
                        if (confirm(`Remover ${p.name}?`)) {
                          const weeks = season.weeks.map(w => { const m = { ...w.marks }; delete m[p.name]; return { ...w, marks: m }; });
                          setSeason({ weeks, players: season.players.filter(x => x.name !== p.name) });
                        }
                      }} style={{ fontSize: 12, border: "none", background: "transparent", color: C.red, cursor: "pointer" }}>remover</button>
                    </div>
                  )}
                </div>
              ))}
            </div>

            {canEditGeneral && (
              <SeasonSettings season={season} setSeason={setSeason} S={S}
                canDelete={data.seasons.length > 1}
                onDelete={() => {
                  if (confirm(`Apagar a época ${season.name}?`)) {
                    const seasons = data.seasons.filter((_, i) => i !== sIdx);
                    update({ ...data, seasons });
                    setSIdx(Math.max(0, sIdx - 1));
                  }
                }} />
            )}
          </div>
        )}
      </div>
    </div>
  );
}

function SeasonSettings({ season, setSeason, S, canDelete, onDelete }) {
  const [open, setOpen] = useState(false);
  const num = (v, fb) => { const n = Number(v); return isNaN(n) ? fb : n; };
  const row = { display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" };
  const daySelect = (val, onCh) => (
    <select value={val} onChange={onCh} style={{ ...S.input, flex: 1 }}>
      {DAYS.map((d, i) => <option key={i} value={i}>{d}</option>)}
    </select>
  );
  return (
    <div style={{ ...S.card, padding: 14 }}>
      <button onClick={() => setOpen(o => !o)} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", width: "100%", background: "none", border: "none", cursor: "pointer", padding: 0, fontFamily: FONT_NUM }}>
        <span style={{ fontSize: 20, fontWeight: 700, color: C.ink }}>⚙️ Definições da época</span>
        <span style={{ fontSize: 18, color: C.sub }}>{open ? "▴" : "▾"}</span>
      </button>
      {open && (
        <div style={{ marginTop: 12 }}>
          <div style={row}>
            <div style={{ flex: 1, minWidth: 120 }}>
              <label style={S.lbl}>Nome da época</label>
              <input value={season.name} onChange={e => setSeason({ name: e.target.value })} style={{ ...S.input, width: "100%", boxSizing: "border-box" }} />
            </div>
            <div style={{ flex: 2, minWidth: 160 }}>
              <label style={S.lbl}>Campo</label>
              <input value={season.venue} onChange={e => setSeason({ venue: e.target.value })} style={{ ...S.input, width: "100%", boxSizing: "border-box" }} />
            </div>
          </div>
          {canDelete && (
            <button onClick={onDelete} style={{ fontSize: 12.5, border: `1px solid ${C.red}`, color: C.red, background: "none", borderRadius: 6, padding: "6px 12px", cursor: "pointer", marginTop: 4 }}>
              Apagar esta época
            </button>
          )}
        </div>
      )}
    </div>
  );
}

function NewSeasonForm({ base, S, onCreate }) {
  const [name, setName] = useState("");
  const [venue, setVenue] = useState(base.venue);
  const [start, setStart] = useState("");
  const [n, setN] = useState(14);
  return (
    <div style={{ ...S.card, padding: 14, marginBottom: 14, border: `1.5px solid ${C.green}` }}>
      <div style={{ fontFamily: FONT_NUM, fontSize: 20, fontWeight: 700, marginBottom: 10 }}>Nova época</div>
      <div style={{ display: "flex", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
        <div style={{ flex: 1, minWidth: 110 }}>
          <label style={S.lbl}>Nome (ex.: 2026/4)</label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="2026/4" style={{ ...S.input, width: "100%", boxSizing: "border-box" }} />
        </div>
        <div style={{ flex: 2, minWidth: 150 }}>
          <label style={S.lbl}>Campo</label>
          <input value={venue} onChange={e => setVenue(e.target.value)} style={{ ...S.input, width: "100%", boxSizing: "border-box" }} />
        </div>
      </div>
      <button onClick={() => {
        if (!name.trim()) { alert("Dá um nome à época."); return; }
        const weeks = [];
        for (let i = 0; i < n; i++) weeks.push({ date: "", gB: "", gP: "", marks: {}, locked: false });
        onCreate({
          id: "s_" + Date.now(), name: name.trim(), venue: venue.trim() || base.venue,
          gameDay: base.gameDay, gameTime: base.gameTime, convDay: base.convDay, convTime: base.convTime, convSlots: base.convSlots,
          fineAmount: base.fineAmount, fineTolerance: base.fineTolerance,
          prizes: JSON.parse(JSON.stringify(base.prizes)),
          points: { ...base.points },
          players: base.players.filter(p => !p.guest).map(p => ({ name: p.name, guest: false })),
          weeks, fines: [],
        });
      }} style={{ width: "100%", background: C.green, color: "#fff", border: "none", borderRadius: 8, padding: "11px", fontFamily: FONT_NUM, fontSize: 17, fontWeight: 700, cursor: "pointer" }}>
        Criar época
      </button>
    </div>
  );
}

function Setup({ onDemo }) {
  return (
    <div style={{ minHeight: "100vh", background: "#EDF0EC", fontFamily: FONT, color: "#16181A", padding: "24px 12px" }}>
      <div style={{ maxWidth: 560, margin: "0 auto" }}>
        <h1 style={{ fontFamily: FONT_NUM, fontWeight: 700, fontSize: 32, margin: "0 0 4px" }}>Configuração Inicial Firebase</h1>
        <button onClick={onDemo} style={{ width: "100%", padding: "12px", borderRadius: 8, border: "1.5px solid #1E6B40", background: "transparent", color: "#1E6B40", fontFamily: FONT_NUM, fontSize: 17, fontWeight: 700, cursor: "pointer", marginTop: 20 }}>
          Ver a app em modo demonstração (sem gravar)
        </button>
      </div>
    </div>
  );
}

function AddPlayer({ onAdd }) {
  const [name, setName] = useState("");
  const [guest, setGuest] = useState(false);
  return (
    <div style={{ display: "flex", gap: 6, alignItems: "center", marginBottom: 8 }}>
      <input value={name} onChange={e => setName(e.target.value)} placeholder="Nome do jogador"
        onKeyDown={e => { if (e.key === "Enter") { onAdd(name, guest); setName(""); } }}
        style={{ flex: 1, minWidth: 0, border: "1px solid #DCE0DA", borderRadius: 6, padding: "7px 10px", fontSize: 14, fontFamily: "'Barlow',sans-serif" }} />
      <label style={{ fontSize: 12, color: "#6B7069", display: "flex", alignItems: "center", gap: 4, whiteSpace: "nowrap" }}>
        <input type="checkbox" checked={guest} onChange={e => setGuest(e.target.checked)} /> conv.
      </label>
      <button onClick={() => { onAdd(name, guest); setName(""); }}
        style={{ background: "#1E6B40", color: "#fff", border: "none", borderRadius: 6, padding: "7px 12px", fontWeight: 600, cursor: "pointer", fontSize: 14 }}>
        Adicionar
      </button>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(PremiumLeague));
</script>
</body>
